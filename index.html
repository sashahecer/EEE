<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Game Pure JavaScript</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        canvas {
            background: #eee;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <canvas id="game" width="720" height="720"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let points = 0;
        document.addEventListener('click', handleClick);
        function drawButton(positionX, positionY) {
            ctx.beginPath();
            ctx.rect(positionX, positionY, 200, 200);
            ctx.stroke();
            ctx.fillText('Click Me', positionX + 50, positionY + 30);
            ctx.closePath();
        }
        function drawText(positionX, positionY) {
            ctx.fillStyle = 'black';
            ctx.font = '20px Arial';
            ctx.fillText(`Points: ${points}`, positionX, positionY);
        }
        function rander() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawText(10, 30);
            drawButton(canvas.width / 2 - 100, 360);
        }
        function handleClick() {
            points++;
        }
        function gameLoop() {
            rander();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>

</html>
