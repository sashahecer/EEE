<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Game Pure JavaScript</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        canvas {
            background: #eee;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <canvas id="game" width="720" height="720"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let points = 0;
        document.addEventListener('click', handleClick);
        function drawButton(positionX, positionY, textX, textY, height, width, text) {
            ctx.beginPath();
            ctx.rect(positionX, positionY, width, height);
            ctx.stroke();
            ctx.fillText(text, textX, textY);
            ctx.closePath();
        }
        function drawText(positionX, positionY) {
            ctx.fillStyle = 'black';
            ctx.font = '20px Arial';
            ctx.fillText(`Points: ${points}`, positionX, positionY);
        }
        function rander() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawText(10, 30);
            drawButton(canvas.width / 2 - 100, 360, canvas.width / 2 - 50, 400, 200, 200, 'Click Me');
            drawButton(500, 10, 520, 30, 60, 200, 'Upgrade');
        }
        const button = {
                x: canvas.width / 2 - 100,
                y: 360,
                width: 200,
                height: 200
        };
        function handleClick(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (event.clientX - rect.left) * scaleX;
            const mouseY = (event.clientY - rect.top) * scaleY;
            const isInsideButton =
                mouseX >= button.x &&
                mouseX <= button.x + button.width &&
                mouseY >= button.y &&
                mouseY <= button.y + button.height;
            if (isInsideButton) {
                points++;
            }
        }
        function gameLoop() {
            rander();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>

</html>
